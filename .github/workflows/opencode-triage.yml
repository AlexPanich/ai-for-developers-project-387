name: Issue Triage

on:
    issues:
        types: [opened]

jobs:
    triage:
        # Issue от ботов (dependabot, github-actions, собственные агенты репо) не триажим
        if: ${{ !endsWith(github.event.issue.user.login, '[bot]') }}
        runs-on: ubuntu-latest
        # Триаж не должен крутиться дольше 15 минут: расследование — не имплементация
        timeout-minutes: 15
        permissions:
            id-token: write
            contents: write
            pull-requests: write
            issues: write
        steps:
            - name: Check account age
              id: check
              uses: actions/github-script@v7
              with:
                  script: |
                      const user = await github.rest.users.getByUsername({
                        username: context.payload.issue.user.login
                      });
                      const created = new Date(user.data.created_at);
                      const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
                      return days >= 30;
                  result-encoding: string

            - uses: actions/checkout@v6
              if: steps.check.outputs.result == 'true'
              with:
                  persist-credentials: false

            - uses: anomalyco/opencode/github@latest
              if: steps.check.outputs.result == 'true'
              env:
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
                  # gh CLI в шелле агента: ставить метки triage может только он
                  GH_TOKEN: ${{ github.token }}
              with:
                  share: false
                  model: opencode/mimo-v2.6-flash-free
                  prompt: |
                      Triage this issue. Do not modify code and do not push anything.

                      1. Investigate first: read AGENTS.md, SPEC.md and the relevant
                         code before judging. Reference SPEC sections by number.
                      2. Apply exactly one label with the gh CLI:
                             gh issue edit <issue-number> --add-label <label>
                         Vocabulary is in docs/agents/triage-labels.md:
                             ready-for-agent  clear bug/feature, obvious fix path
                             needs-info       cannot act without reporter details
                             needs-triage     vague scope or needs a maintainer decision
                             ready-for-human  should be implemented by a person
                      3. Post one short comment: what you found, which label you
                         applied and why. Link to SPEC/ADR/code lines you relied on.
                      If nothing is actionable, still apply needs-triage — silence is not triage.
