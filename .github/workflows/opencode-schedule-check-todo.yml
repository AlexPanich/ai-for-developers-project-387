name: Weekly TODO Audit
on:
    schedule:
        - cron: "0 9 * * 2" # Every Tuesday at 9am UTC
jobs:
    opencode:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write
            pull-requests: write
            issues: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - name: Run OpenCode
              uses: anomalyco/opencode/github@latest
              env:
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
              with:
                  share: false
                  model: opencode/mimo-v2.6-flash-free
                  prompt: |
                      Review the codebase for TODO, FIXME, and HACK comments.
                      Group them by priority and create an issue with a summary.
