name: Weekly TODO Audit
on:
    schedule:
        - cron: "0 9 * * 2" # Every Tuesday at 9am UTC
    workflow_dispatch:
        inputs:
            model:
                description: "Model to use"
                required: false
                default: "opencode/mimo-v2.6-flash-free"
                type: string
jobs:
    opencode:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            id-token: write
            contents: write
            pull-requests: write
            issues: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - name: Run OpenCode
              uses: anomalyco/opencode/github@latest
              env:
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
                  # gh CLI в шелле агента: без GH_TOKEN `gh issue`/`gh label` не пройдут авторизацию
                  GH_TOKEN: ${{ github.token }}
              with:
                  share: false
                  model: ${{ inputs.model || 'opencode/mimo-v2.6-flash-free' }}
                  prompt: |
                      Ты — автоматический аудитор техдолга этого монорепозитория (Bun, workspaces: apps/*, contract и корень).
                      Задача: найти в исходном коде маркеры `TODO`, `FIXME` и `HACK`, сгруппировать их по приоритету и, если есть actionable находки, завести GitHub Issue со сводкой. Править код, package.json и любые другие файлы репозитория нельзя — только анализ и Issue.

                      Выполни шаги строго по порядку:

                      1. Найди маркеры: `grep -rniE "TODO|FIXME|HACK" --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude=bun.lock .`
                         Отбрось ложные срабатывания: actionable считаются только маркеры в исходном коде (apps/*, contract, e2e, корневые конфиги). Сам воркфлоу аудита `.github/workflows/opencode-schedule-check-todo.yml`, строки README и доков, которые лишь упоминают слова TODO/FIXME/HACK (например «TODOs» в доке скилла scaffold-exercises), случайные `XXX` в base64-хешах — не находки.

                      2. Сгруппируй находки по приоритету: FIXME — высокий (потенциальный баг), HACK — средний (обходное решение), TODO — низкий (незапланированная работа). Для каждой: `файл:строка`, текст маркера и контекст (одна-две фразы, о чём речь).

                      3. Сформируй сводку: таблица «Приоритет | Маркер | Количество» плюс по каждой находке `файл:строка` — маркер — контекст.
                         Если actionable находок НЕТ — НЕ создавай issue и НЕ комментируй, заверши работу.

                      4. Определи дату запуска: `date +%F` (формат YYYY-MM-DD).

                      5. Проверь, есть ли уже открытый issue с лейблом `todo-audit`:
                         `gh issue list --state open --label todo-audit --json number,title --jq '.[] | .number'`.
                         Если команда создания issue с `--label todo-audit` упадёт из-за отсутствия лейбла, сначала создай его: `gh label create todo-audit --color d93f0b --description "Техдолг: маркеры TODO/FIXME/HACK в исходниках"`.

                         Затем действуй одним из способов:

                         A) Если открытого issue с лейблом `todo-audit` НЕТ — создай один GitHub Issue:
                            `gh issue create --label todo-audit --title "todo: техдолг — маркеры TODO/FIXME/HACK (<дата запуска>)" --body "<markdown>"`
                            Тело issue (markdown):
                            - Вводная строка: что это еженедельный аудит маркеров TODO/FIXME/HACK от <дата>.
                            - Секция «Сводка по приоритетам» — таблица: Приоритет | Маркер | Количество.
                            - Секции «Высокий (FIXME)», «Средний (HACK)», «Низкий (TODO)» — списки находок `файл:строка` — маркер — контекст. Если в каком-то приоритете находок нет, в сводке у него 0, отдельную пустую секцию не делай.
                            - Секция «Как исправить» — по каждой находке конкретное действие (исправить и удалить маркер, завести тикет и т.п.).

                         B) Если открытый issue с лейблом `todo-audit` УЖЕ есть — не создавай дубликат: добавь туда комментарий `gh issue comment <number> --body "<markdown>"` с сегодняшней сводкой (та же структура тела, что выше), и только если сводка изменилась (появились новые маркеры, изменились файлы/строки) либо повторяется нетривиальная проблема, требующая внимания.

                      Важно:
                      - Работай только через `gh` CLI и `grep`; не коммить, не пуши, не открывай PR.
                      - Не меняй ни один файл репозитория.
                      - Не прерывайся на нерелевантные вопросы; если команда требует подтверждения — используй неинтерактивные флаги (`gh` работает без промптов).
